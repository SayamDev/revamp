# Optional local n8n for Relay.
#
#   docker compose -f n8n/docker-compose.yml up -d
#
# Then open http://localhost:5678, create the local owner account n8n asks for,
# import n8n/new-enquiry-workflow.json and activate it. See n8n/README.md.
#
# Nothing here is required to run Relay. The app defaults to its own local
# workflow engine and falls back to it automatically if n8n is unreachable.

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: relay-n8n
    restart: unless-stopped
    ports:
      - '5678:5678'
    environment:
      # Local HTTP only — n8n refuses to set its session cookie otherwise.
      N8N_SECURE_COOKIE: 'false'
      N8N_HOST: localhost
      N8N_PORT: '5678'
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: Europe/London
      N8N_RUNNERS_ENABLED: 'true'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
    volumes:
      - relay_n8n_data:/home/node/.n8n

volumes:
  relay_n8n_data:
